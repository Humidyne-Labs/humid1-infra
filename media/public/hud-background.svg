<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" fill="none">
  <defs>
    <!-- Seamless Technical Dot Grid (40x40) -->
    <pattern id="tech-dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#ffffff" opacity="0.12"/>
      <path d="M18 20H22M20 18V22" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
    </pattern>

    <!-- Linear Horizon Scanline -->
    <pattern id="scanlines" width="100%" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="3" x2="1920" y2="3" stroke="#ffffff" stroke-width="0.5" opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Deep Interface Base Surface -->
  <rect width="1920" height="1080" fill="#080808"/>
  
  <!-- Patterns -->
  <rect width="1920" height="1080" fill="url(#tech-dots)"/>
  <rect width="1920" height="1080" fill="url(#scanlines)"/>

  <!-- Subtle Radial Spotlight in Center -->
  <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#center-glow)"/>

  <!-- Outer HUD Framing Brackets -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.3">
    <!-- Top-Left Corner -->
    <path d="M40 90V40H90"/>
    <rect x="36" y="36" width="8" height="8" fill="#ffffff"/>
    
    <!-- Top-Right Corner -->
    <path d="M1880 90V40H1830"/>
    <rect x="1876" y="36" width="8" height="8" fill="#ffffff"/>
    
    <!-- Bottom-Left Corner -->
    <path d="M40 990V1040H90"/>
    <rect x="36" y="1036" width="8" height="8" fill="#ffffff"/>
    
    <!-- Bottom-Right Corner -->
    <path d="M1880 990V1040H1830"/>
    <rect x="1876" y="1036" width="8" height="8" fill="#ffffff"/>
  </g>

  <!-- Center-Left Telemetry Reticle -->
  <g transform="translate(240, 540)" opacity="0.15" stroke="#ffffff">
    <circle r="160" stroke-width="1" stroke-dasharray="6 6"/>
    <circle r="120" stroke-width="1.5"/>
    <circle r="60" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="-180" y1="0" x2="180" y2="0" stroke-width="1"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke-width="1"/>
  </g>

  <!-- Center-Right Telemetry Data Nodes -->
  <g transform="translate(1680, 540)" opacity="0.15" stroke="#ffffff">
    <circle r="140" stroke-width="1" stroke-dasharray="4 8"/>
    <polyline points="-120,40 -60,-20 0,30 60,-50 120,10" stroke-width="2"/>
    <circle cx="-60" cy="-20" r="4" fill="#ba1a1a"/>
    <circle cx="60" cy="-50" r="4" fill="#ba1a1a"/>
  </g>

  <!-- Telemetry HUD Text Annotations -->
  <g font-family="'JetBrains Mono', monospace" fill="#ffffff" opacity="0.35" font-size="10" letter-spacing="2">
    <!-- Top Bar Status -->
    <text x="60" y="70">SYS_LOC :: [ETNA_OH_45.9N_12.1E]</text>
    <text x="1860" y="70" text-anchor="end">SYS_STAT :: NOMINAL [22.4°C]</text>

    <!-- Bottom Bar Status -->
    <text x="60" y="1020">GRID_UPLINK :: ACTIVE [12ms]</text>
    <text x="1860" y="1020" text-anchor="end">CORE_BUILD :: HUMID1_OS_v2.5.0</text>
  </g>
</svg>